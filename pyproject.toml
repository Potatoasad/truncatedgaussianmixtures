[project]
name = "truncatedgaussianmixtures"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "juliacall",
    "matplotlib",
    "numpy",
    "pandas",
    "scipy",
    "h5py",
    "tqdm"
]

[project.optional-dependencies]
# Hybrid JAX (E-step) + Julia (M-step) backend: fit_gmm(..., backend="jax")
jax = ["jax"]
cuda = ["jax[cuda12]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["truncatedgaussianmixtures"]

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
truncatedgaussianmixtures = { workspace = true }

[dependency-groups]
dev = [
    "pytest",
    "truncatedgaussianmixtures",
]
